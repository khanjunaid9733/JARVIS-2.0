nats:
  nat_01:
    bind: "capability registry + intent ABI (constitution 6/11)"
    status: "implemented"
    note: "both halves now demonstrated end-to-end in tests/acceptance/test_m1_acceptance.py: ungranted capability -> ValidationFailure, no Manifest; effect outside manifest -> EffectFailure(refused) with adapter.calls == 0"
  nat_02:
    bind: "creator identity + capability registry authority (constitution 5)"
    status: "partial"
    note: "deterministic half implemented (test_nat_02_non_creator_registration_is_rejected: non-creator principal_id -> AuthorityUnavailable, registry unchanged); signature-verification half of authority deferred until a key-based authority module lands (documented M1 trust model: principal_id equality)"
  nat_03:
    bind: "event log -> minimal memory projection (constitution 20)"
    status: "implemented"
    note: "digest = sha256(canonical JSON of projection state: last_seq, event_count, streams, providers, memories) in kernel/memory_projection.py (MemoryProjection.digest()); replaces the interim EventLog.projection_digest() stream proxy per s134.1. Event bytes/timestamps excluded; identical logs -> identical digest"
  nat_04:
    bind: "event log (constitution 10)"
    status: "implemented"
    note: "replay() always verifies; tamper halts with EventIntegrityError"
  nat_05:
    bind: "deterministic FSM / done-gate (constitution 12)"
    status: "implemented"
    note: "deterministic done-gate implemented in kernel/done_gate.py (module 10): CompletionGate.declare_completion is the only completion path and emits task.completed ONLY on a passing gate decision; failed evidence emits task.completion_refused, never a completion event (tests test_nat_05_completion_without_evidence_is_refused / _partial_evidence_still_refused). Full mission-lifecycle FSM is STRETCH (M1.1, s134.1) and not required for this NAT; the agent-runtime half is simulated by direct calls (no agent runtime in M1)"

