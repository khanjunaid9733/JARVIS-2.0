  live_loop_components:
    real:  # exercised end-to-end through the real CLI on a clean JARVIS_HOME
      - "memory kernel: CoreService EventLog (hash-chained, verify_chain OK after every run) + MemoryProjection + MemoryWriter/Memory recall"
      - "effect envelope + path-jailed FilesystemEffectAdapter: atomic write, declared postconditions verified before an effect counts"
      - "orchestrator: Router (L5, I5 on canonical identities), MissionRunner ratchet (M3.2), RecoveryEngine ladder+ACT (M3.4) with a RETRY that really re-executes the worker and carries the failure bytes, SupervisorDaemon (M3.5) ticked over real dispatch records + a real mission lease"
      - "completion: CompletionGate (NAT-05) is the only writer of task.completed; a halted mission emits task.completion_refused"
      - "voice: StreamingVoiceLoop 6-state FSM journaled on stream 'voice-session'; STT via the real whisper CLI (transcribed real speech on this machine)"
      - "voice OUT: a real synthesis engine speaks - JARVIS_TTS_CMD (contract unchanged) | piper | the Windows OS engine System.Speech via powershell | espeak-ng; every payload is MEASURED before it counts (parsed WAV: duration, rate, peak, RMS) and a silent or non-WAV payload is reported as a FAILED synthesis with no file written"
      - "voice IN over real audio: `--audio <wav>` feeds the FSM real 30ms frames whose activity is the MEASURED RMS energy of those samples (46 speech / 33 silence on a real spoken question here); the FSM's collected buffer holds those bytes"
      - "worker/verifier seam (src/jarvis/live_dispatch.py): a step is dispatched to a REAL external process through the L7 bridge - real Handle/process_id/exit code and honest containment (precondition | spawn-fault | timeout | self-attested | failed) - and the artifact is adjudicated by an IndependentVerifier in a FRESH process attributed to a different provider; I5 is enforced fail-closed (a resolved verifier that holds RED_TEAM_REVIEWER for the package -> outcome HELD, zero steps, zero completion event) and the verifier's own exit code decides accept vs refusal"
    seams:  # named in the command output, never reported as verified
      - "no microphone device is opened: a typed turn declares `caller-declared` VAD and says nothing was captured; real audio in requires `--audio <file>`"
      - "default worker is local: `--worker local` (the default) runs in-process and is labelled 'local (in-process, NOT a dispatch)' - never reported as a dispatch; `--worker auto` chooses the external engine only when its binary is on PATH"
      - "external engine availability on THIS machine: no external agent engine can produce an artifact. `opencode run` never returns non-interactively (4 timed attempts, 200-240s, empty stdout/stderr, exit 124) and `agy -p --output-format json` exits 0 while reporting that every tool call is blocked by a malformed global plugin hook path. A real `jarvis mission --worker external` therefore ends in containment timeout + `task.completion_refused`, printed verbatim instead of being dressed up as a dispatch"
      - "external worker containment is process-tree containment, NOT a filesystem sandbox: the workspace jail governs what may be ACCEPTED, not what the engine may touch; Sandbox.network_allowed / max_memory_mb are declared and unenforced"
      - "recovery git rollback: GitSeam not injected - ROLLBACK is declared, never executed"
      - "multimodal vision: VisionModelAdapter remains library-only (no image turn)"
      - "audio playback: the turn writes the WAV beside the log and names the path; it does not open a speaker"
