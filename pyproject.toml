[project]
name = "jarvis"
version = "0.0.0"
description = "JARVIS 2.0 - persistent cognitive operating system (M1 kernel baseline)"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.5,<3",
    "cryptography>=42,<46",
    "httpx>=0.27,<1",
    "anyio>=4.0,<5",
    "opentelemetry-api>=1.20,<2",
    "opentelemetry-sdk>=1.20,<2",
]

[dependency-groups]
# Red-team finding F8: pytest was never declared, so `uv run pytest` could
# silently resolve a system PATH pytest under an interpreter below the
# ADR-008 pin floor. Declaring it pins the suite to the project venv.
dev = ["pytest>=9,<10"]

[project.scripts]
jarvis = "jarvis.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
